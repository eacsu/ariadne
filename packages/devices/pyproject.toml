[tool.poetry]
name = "ariadne-devices"
version = "0.1.0"
description = "Ariadne devices"
authors = ["Ariadne contributors"]
packages = [{include = "ariadne_devices", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pyserial = ">=3.5,<4"
gpiod = ">=1.5,<2"
python-periphery = ">=2.4,<3"
typer = ">=0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
