[tool.poetry]
name = "ec-26-e"
version = "0.1.0"
description = "Ariadne app"
authors = ["Ariadne contributors"]
packages = [{include = "ec_26_e", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=2"
opencv-python = ">=4.10"
shapely = ">=2,<3"
typer = ">=0.12"
ariadne-solver = {path = "../../packages/solver", develop = true}
ariadne-vision = {path = "../../packages/vision", develop = true}
ariadne-devices = {path = "../../packages/devices", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
ec-26-e = "ec_26_e.command.app:app"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
